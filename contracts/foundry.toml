[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["lib", "../node_modules"]
remappings = [
  "@account-abstraction/=../node_modules/@account-abstraction/",
  "@openzeppelin/=../node_modules/@openzeppelin/"
]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[fmt]
line_length = 100
