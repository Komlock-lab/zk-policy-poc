name: Repository checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check repository conventions
        run: ./scripts/check-repo.sh
      - name: Validate planning documents
        run: node scripts/validate-planning.mjs
      - name: Type-check TypeScript
        run: pnpm typecheck
      - name: Test policy package and apps without the prover
        run: NODE_OPTIONS=--experimental-sqlite pnpm exec vitest run apps packages/policy scripts/lib

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Run Foundry tests
        run: forge test --root contracts -vvv
